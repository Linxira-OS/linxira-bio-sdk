[package]
name = "gpu-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
publish = false

[features]
# Vendor backends are never default; each requires its native SDK at build
# or run time and stays out of every CI graph.
gpu-cutile = []
gpu-musa = []
gpu-sycl = []
# D3: one-shot compile probe of the real sycl-rs crate (upstream tests Linux
# only; the Windows outcome is ledger material either way).
gpu-sycl-attempt = ["dep:sycl-rs"]

[dependencies]
bytemuck = "1"
memory-stats = "1"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "30"
sycl-rs = { version = "0.0.9", optional = true }
