<text x="764.0" y="390.0" fill="#fb7185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="600" text-anchor="middle">within-noise</text>
<text x="24" y="478" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">Digest-checked inputs → 1 untimed warm-up → 10 timed repeats (the report holds only these 10) → median/IQR/CV → bootstrap confidence interval →</text>
<text x="24" y="493" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">three-way verdict. The warm-up never enters a statistic; the trimming bases are robustness checks only. Every number is the raw median of the 10 timed</text>
<text x="24" y="508" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">repeats — presentation only: no smoothing, no axis truncation, no statistical transformation</text>
</svg>
