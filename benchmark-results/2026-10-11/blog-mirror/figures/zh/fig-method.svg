<text x="764.0" y="390.0" fill="#fb7185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="600" text-anchor="middle">within-noise</text>
<text x="24" y="493" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">输入固定并记录摘要 → 1 次不计时预热 → 10 次计时重复（报告只含这 10 条）→ 中位数/IQR/CV → bootstrap 置信区间 → 三段式判定。预热那次不进统计；裁剪口径只</text>
<text x="24" y="508" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">是稳健性检查。 图中数字为 10 次计时重复的原始中位数，仅作呈现：无平滑、无坐标轴截断、无任何统计变换</text>
</svg>
