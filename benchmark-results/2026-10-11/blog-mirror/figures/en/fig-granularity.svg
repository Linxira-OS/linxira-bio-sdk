<text x="24" y="493" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">crossings are not what separates the backends. Every number is the raw median of the 10 timed repeats — presentation only: no smoothing, no axis</text>
