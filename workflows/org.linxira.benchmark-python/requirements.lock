# Direct pins live in requirements.in: biopython 1.85 and numpy 2.2.4 mirror
# org.linxira.sequence-conversion-biopython so one environment serves both
# packs, plus pytrf 1.5.0 for the python SSR arm. pytrf declares pyfastx>=2.3.1,
# so pyfastx is pinned as a transitive requirement: a pin set that omits it
# cannot satisfy `uv pip install --require-hashes`, which is how this file is
# consumed (the revision before this one omitted it, and carried an escaped
# line-break sequence instead of real line breaks, so nothing ever installed
# from it).
# Runtime: CPython 3.12. Hashes cover every platform this pack installs on:
# x86_64-manylinux (CI and the benchmark hosts) and x86_64 windows (development
# machines). Each block records why it is pinned.
# The pinned pytrf/pyfastx versions are the ones the 2026-10-11 archive ran
# (pytrf 1.5.0, pyfastx 2.3.1); biopython/numpy are pinned below the versions
# that archive happened to have (1.88/2.5.4) on purpose, so the lock states the
# intended environment and the next window installs from it.

