<text x="24" y="891" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">Each row is one backend's median ratio against Rust with its 95% interval (10,000 resamples, seed 20261011). The verdict reads the interval only:</text>
<text x="24" y="906" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">entirely ≥ 1.10 is material; an interval crossing 1.00 is within-noise (no resolvable difference). The shaded band is ±2×(CV sum), shown for context</text>
<text x="24" y="921" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">and not used as a threshold. Every number is the raw median of the 10 timed repeats — presentation only: no smoothing, no axis truncation, no</text>
<text x="24" y="936" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">statistical transformation</text>
