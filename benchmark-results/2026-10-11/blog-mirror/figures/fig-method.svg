<text x="24" y="410" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11">Inputs are fixed and digest-checked; every backend runs one untimed warm-up plus 10 timed repeats, and the report holds only the 10 timed ones ·</text>
<text x="24" y="424" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11">verdicts come from a bootstrap confidence interval on the median ratio, never from a point estimate · the drop-first and middle-8 bases are robustness</text>
<text x="24" y="438" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11">checks, not alternative headlines</text>
