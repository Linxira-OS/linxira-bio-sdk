<text x="24" y="523" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif" font-size="11.5">每根柱 = 该形态下该后端 10 次计时重复的中位数。 三种形态之间每个后端的变化 &lt; 7%，说明语言边界穿越次数不是差距来源。图中数字为 10 次计时重复的原始中位</text>
